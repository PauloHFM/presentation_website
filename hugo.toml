baseURL = "https://me.paulohfm.com/"
title = "Paulo Henrique F. Macedo"
theme = "coder"
locale = "en"
defaultContentLanguage = "en"

enableEmoji = true

ignoreFiles = ["\\.Rmd$", "\\.Rmarkdown$", "_files$", "_cache$", ".*test_*"]

[pagination]
  pagerSize = 6

[services]
[services.disqus]
# Enable Disqus comments
# shortname = "yourdiscussshortname"

[markup.highlight]
noClasses = false

[params]
author = "Paulo Henrique F. Macedo"
# license = '<a rel="license" href="http://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA-4.0</a>'
description = "Paulo's personal website"
keywords = "data,engineer,developer,personal,presentation"
info = ["Physics and Data Engineer"]
# avatarURL = "images/erfils.jpg"
email = "me@paulohfm.com"
gravatar = "me@paulohfm.com"
dateFormat = "January 2, 2006"
since = 2024
# Git Commit in Footer, uncomment the line below to enable it
# commit = "https://github.com/luizdepra/hugo-coder/tree/"
# Right To Left, shift content direction for languages such as Arabic
rtl = false
# Specify light/dark colorscheme
# Supported values:
# "auto" (use preference set by browser)
# "dark" (dark background, light foreground)
# "light" (light background, dark foreground) (default)
colorScheme = "auto"
# Hide the toggle button, along with the associated vertical divider
hideColorSchemeToggle = false
# Series see also post count
maxSeeAlsoItems = 5
# Custom CSS
customCSS = []
# Custom SCSS, file path is relative to Hugo's asset folder (default: {your project root}/assets)
customSCSS = []

# Custom JS
customJS = []

# Custom remote JS files
customRemoteJS = []

# Analytics (Fathom, Plausible, GoatCounter, Cloudflare, Matomo, Umami, ...) and
# the Content-Security-Policy are configured under [params.*] and documented in the
# theme: themes/coder/docs/analytics.md and themes/coder/docs/configurations.md

  # The footer is layouts/partials/footer.html: "© <since> - <current year> <author>"
  # (since = 2024 above; the year is computed at build time) plus these lines.
  [params.footer]
    bottomText = [
      "Powered by <a href=\"https://gohugo.io\">Hugo</a>",
    " & Made with &#10084; by <a href=\"https://github.com/PauloHFM\">Paulo</a>"
    ]

  # Colors for favicons
  #
  [params.favicon.color]
    mask = "#1b1c1d"
    msapplication = "#1b1c1d"
    theme = "#1b1c1d"

  [params.logo]
    logoMark     = ">"
    logoText     = "$ cd /home/"
    logoHomeLink = "/"

